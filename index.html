<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>小児薬用量計算アプリ</title>
<style>
:root{
  --bg:#eef1f4; --card:#fff; --ink:#15181d; --sub:#5f6874; --line:#e1e6ec;
  --accent:#0b6b5e; --accent2:#e6f2f0; --warn:#a8500b; --warnbg:#fdf2e4;
  --band:#f0f7f5;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:0 0 50px;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}

header{background:var(--accent);color:#fff;padding:11px 0}
header h1{margin:0;font-size:16px;font-weight:600}

/* 入力バー */
.bar{position:sticky;top:0;z-index:30;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.06);padding:9px 0}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inputs{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.frow{display:flex;align-items:center;gap:8px}
.flabel{font-size:14px;font-weight:700;color:var(--sub);width:40px;flex:none}
.frow input{font-family:inherit;font-size:28px;font-weight:700;line-height:1;padding:0 12px;width:128px;height:34px;
  border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);
  text-align:right;-webkit-appearance:none}
.frow input:focus{outline:none;border-color:var(--accent);background:#fbfffe}
.frow input.auto{color:#8d97a3;border-style:dashed}
.unit{font-size:15px;color:var(--sub);font-weight:600}
.stp{flex:none;width:54px;height:34px;border:1.5px solid var(--line);background:#fff;
  border-radius:9px;color:var(--accent);font-family:inherit;font-size:24px;font-weight:700;line-height:1;padding:0;cursor:pointer;-webkit-appearance:none}
.stp:active{background:var(--accent2)}

.rightside{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:2px}
.rlabel{font-size:13px;font-weight:700;color:var(--sub)}
.btn{font:600 13px/1 inherit;padding:11px 13px;border:1px solid var(--line);background:#fff;
  border-radius:10px;color:var(--sub);cursor:pointer;-webkit-appearance:none}
.btn:active{background:#f2f4f7}
.cnt{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cnt button{font-family:inherit;font-size:15px;font-weight:700;line-height:1;padding:0;width:34px;height:38px;
  border:none;background:#fff;color:var(--sub);cursor:pointer;-webkit-appearance:none}
.cnt button+button{border-left:1px solid var(--line)}
@media(max-width:640px){ .toprow{gap:8px;align-items:center} .cnt button{width:29px;font-size:14px} }
.sumrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.sumrow #msg{margin-top:0;flex:1;min-width:0}
.sumrow .btn{flex:none;padding:9px 12px}
.cnt button.on{background:var(--accent);color:#fff}
#msg .wsd{display:inline-flex;flex-direction:column;vertical-align:middle;margin-left:14px;
  font-size:13px;line-height:1.35;font-weight:700;letter-spacing:0;white-space:nowrap;font-variant-numeric:tabular-nums}
#msg .wsd .m{color:#1f3a93} #msg .wsd .f{color:#c2187a}
#msg .wsd .hi{padding:0 4px;border-radius:4px;margin-left:-4px}
#msg .wsd .m.hi{background:#e6ebf7} #msg .wsd .f.hi{background:#fbe6f1}
#msg{margin-top:10px;font-size:26px;font-weight:700;color:var(--accent);min-height:1.2em;
  letter-spacing:.01em}
#msg .est{font-size:15px;font-weight:600;color:#8d97a3}
#msg.err{color:var(--warn);font-size:18px}
#msg.fl{font-size:16px;line-height:1.35;min-height:43px;display:flex;align-items:center}

/* セット */
.sets{margin:12px 0 2px}
.sets h3{margin:0 0 6px;font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.05em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12.5px/1 inherit;
  padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;
  color:var(--ink);cursor:pointer;-webkit-appearance:none}
.chip:active{background:#eef4f3}
.chip.user{border-color:#cfe3df;background:#f4faf9}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .x{color:#d7ece8}
.chip .x{color:var(--sub);font-size:14px;line-height:1;padding:0 2px;border-radius:4px}
.chip .x:hover{color:var(--warn)}
.chip .x.go{color:#fff;background:var(--warn);font-size:12px;font-weight:700;padding:5px 8px;margin:-4px -6px -4px 2px;border-radius:999px}
.chip.arm{border-color:var(--warn)}
.saverow{display:none;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.saverow.open{display:flex}
.saverow input{font-family:inherit;font-size:16px;padding:9px 10px;border:1.5px solid var(--line);
  border-radius:9px;width:210px;-webkit-appearance:none}
.saverow input:focus{outline:none;border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}

/* スロット（1行表示） */
.slots{margin:12px 0}
.slot{background:var(--card);border:1px solid var(--line);border-radius:12px;
  margin-bottom:7px;padding:7px 8px 7px 12px}
.row{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.dname{flex:1 1 130px;min-width:0;text-align:left;font-family:inherit;font-size:18px;font-weight:700;line-height:1.3;color:var(--ink);
  background:none;border:0;padding:4px 0;margin:0;cursor:pointer;-webkit-appearance:none;
  letter-spacing:0}
.dname .cj{letter-spacing:-.1em}
.dname .i{margin-left:6px}
.dname:active{opacity:.6}
.dname .i{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  margin-left:5px;border-radius:50%;border:1.3px solid #a5b0bb;color:#8d97a3;
  font:700 11px/1 Georgia,serif;font-style:italic;vertical-align:2px}
.rv{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
.vals{display:flex;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt{font-size:18px;font-weight:700;color:var(--sub)}
.vbig{font-size:23px;font-weight:700;color:var(--accent);letter-spacing:-.01em}
.vbig.none{font-size:13.5px;color:#9aa6b2;font-weight:600}
.row2{display:flex;align-items:center;gap:8px;margin-top:1px}
.row2 .subline{flex:1;min-width:0;margin-top:0}
.chg{flex:none;height:26px;padding:0 11px;border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--sub);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;-webkit-appearance:none}
.chg:active{background:#f2f4f7}
.subline{font-size:11.5px;color:var(--sub);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wflag{display:inline-block;font-size:10.5px;color:var(--warn);background:var(--warnbg);
  border-radius:5px;padding:1px 6px;margin-top:3px}
@media(max-width:640px){
}
@media(max-width:640px){ .slots .slot{padding:5px 6px 5px 8px} .row{gap:4px 6px} .wrap{padding:0 10px}
  .dname .i{margin-left:4px;width:15px;height:15px;font-size:10px} .dname{font-size:16px} .vbig{font-size:20px}
  .amt{font-size:16px} .vals{gap:6px} .rv{gap:7px} .chg{height:26px;padding:0 10px;font-size:11.5px} }

/* シート（詳細・薬剤選択） */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:rgba(15,20,25,.45);
  display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:88vh;border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){ .ov{align-items:center} .sheet{border-radius:16px;max-height:80vh} }
.sh-h{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 10px 16px;border-bottom:1px solid var(--line)}
.sh-h h2{margin:0;font-size:19px;line-height:1.35;flex:1;min-width:0}
.sh-h h2 small{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-top:2px}
.sh-x{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:#f0f2f5;color:var(--sub);
  font:600 18px/1 inherit;cursor:pointer}
.sh-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 18px}
.dres{display:flex;gap:26px;flex-wrap:wrap;background:var(--band);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.dres .vlab{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.dres .vnum{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dres .vnum.big{font-size:30px;color:var(--accent)}
.dres .none{font-size:16px;color:#9aa6b2;font-weight:600}
.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv th{width:76px;font-size:11.5px;color:var(--sub);background:none;font-weight:700;vertical-align:top;padding:7px 8px 7px 0}
.kv td{padding:7px 0;vertical-align:top}
.dflag{font-size:12.5px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:7px 10px;margin-bottom:10px}
.sh-actions{margin-top:14px}
.sh-actions .btn{width:100%;padding:13px;font-size:14px}

.pk-top{padding:10px 16px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pcats{display:flex;gap:5px;flex-wrap:wrap}
.pcats button{font-family:inherit;font-size:13px;font-weight:700;line-height:1;padding:9px 13px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--sub);cursor:pointer;-webkit-appearance:none}
.pcats button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pk-q{font-family:inherit;font-size:16px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;width:100%;-webkit-appearance:none}
.pk-q:focus{outline:none;border-color:var(--accent)}
.plist{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 8px 14px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;
  border-bottom:1px solid var(--line);padding:10px 8px;cursor:pointer;font-family:inherit;color:var(--ink);-webkit-appearance:none}
.pitem:active{background:#f2f4f7}
.pitem.cur{background:var(--accent2);border-radius:8px}
.pitem .pn{flex:1;min-width:0}
.pitem .pn b{display:block;font-size:15.5px;line-height:1.35}
.pitem .pn span{display:block;font-size:11.5px;color:var(--sub)}
.pitem .pc{flex:none;font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
.pitem .pv{flex:none;font-size:14px;font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.pempty{padding:20px;text-align:center;color:var(--sub);font-size:13px}
.addbtn{display:block;width:100%;margin:2px 0 4px;padding:11px;border:1.5px dashed #b9c6cf;border-radius:12px;
  background:#fff;color:var(--accent);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none}
.addbtn:active{background:var(--accent2)}
.addbtn:disabled{color:#9aa6b2;border-color:var(--line);cursor:default}
.pk-del{flex:none;height:36px;padding:0 12px;border:1px solid #efc9a5;border-radius:9px;background:var(--warnbg);
  color:var(--warn);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;-webkit-appearance:none}
.pk-del:active{background:#f8e0c4}
.del{flex:none;width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;
  color:#9aa6b2;font-family:inherit;font-size:15px;line-height:1;cursor:pointer;-webkit-appearance:none}
.del:active{background:var(--warnbg);color:var(--warn)}
#alltab td.tn{cursor:pointer;color:var(--accent)}

details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
summary{padding:12px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--accent);
  background:var(--accent2);list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";font-size:11px}
details[open] summary:before{content:"▾ "}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:10.5px;color:var(--sub);background:#fafbfc;font-weight:700}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
tr:last-child td{border-bottom:none}
.cat{font-size:10.5px;color:var(--sub)}
.author{text-align:center;font-size:11.5px;color:var(--sub);
  padding:20px 2px 6px;line-height:1.75;letter-spacing:.01em}
.disc{background:var(--warnbg);border:1px solid #f0dcc2;color:var(--warn);
  border-radius:10px;padding:9px 12px;font-size:11.5px;margin:12px 0}
</style>
</head>
<body>

<header><div class="wrap">
  <h1>小児薬用量計算アプリ ver2 (2026/10)</h1>
  </div></header>

<div class="bar">
  <div class="wrap">

    <div class="inputs">
      <div class="frow">
        <span class="flabel">年齢</span>
        <button class="stp" id="yminus" title="1歳 減らす">−</button>
        <input id="y" type="number" inputmode="numeric" step="1" min="0">
        <button class="stp" id="yplus" title="1歳 増やす">＋</button>
        <span class="unit">歳</span>
      </div>

      <div class="frow">
        <span class="flabel">体重</span>
        <button class="stp" id="wminus" title="1 kg 減らす">−</button>
        <input id="w" type="number" inputmode="decimal" step="0.1" min="0">
        <button class="stp" id="wplus" title="1 kg 増やす">＋</button>
        <span class="unit">kg</span>
      </div>
    </div>

    <div class="sumrow"><div id="msg"></div><button class="btn" id="clear">クリア</button></div>

  </div>
</div>

<div class="wrap">

  <div class="sets">
    <div class="chips" id="chips"></div>
    <div class="saverow" id="saverow">
      <input id="setname" type="text" placeholder="セット名（例：かぜ 咳あり）" maxlength="24">
      <button class="btn pri" id="dosave">保存</button>
      <button class="btn" id="cancelsave">やめる</button>
    </div>
  </div>

  <div class="slots" id="slots"></div>
  <button class="addbtn" id="adddrug" type="button">＋ 薬剤を追加</button>

  <div class="disc">処方前に添付文書・ガイドラインで必ず確認してください。</div>

  <details>
    <summary>全薬剤 一覧（計算結果）</summary>
    <div style="overflow-x:auto"><table id="alltab"><thead><tr>
      <th>薬剤</th><th>基準</th><th class="n">成分量</th><th class="n">薬剤量</th><th>用法</th>
    </tr></thead><tbody></tbody></table></div>
  </details>

  <footer class="author">
    Author: Kazuhiro Iwama<br>
    Department of Pediatrics, Yokohama City University
  </footer>

</div>

<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
"use strict";

/* ===================== 薬剤カタログ ===================== */
/* type: p=体重比(散剤・顆粒)  s=シロップ  t=体重帯早見表  a=年齢区分
        x=製剤量直接(g/kg)  i=注射(mg)  z=ゾフルーザ規定  f=固定 */
var DRUGS = [
 {id:"p_calonal", cat:"散", n:"カロナール細粒 20%", s:"アセトアミノフェン", type:"p", conc:20, dose:10, per:"回", freq:"頓用", ratio:"10 mg/kg/回", max:500, note:"6時間以上あけて"},
 {id:"s_calonal", cat:"Sy", n:"カロナール Sy 2%", s:"アセトアミノフェン", type:"s", mgml:20, dose:10, per:"回", freq:"頓用", ratio:"10 mg/kg/回", max:500, note:"6時間以上あけて（0.5 mL/kg/回）"},
 {id:"p_brufen", cat:"散", n:"ブルフェン顆粒 20%", s:"イブプロフェン", type:"p", conc:20, dose:5, per:"回", freq:"頓用", ratio:"5 mg/kg/回", max:200, note:"6時間以上あけて／錠 100・200 mg"},
 {id:"p_asa_acute", cat:"散", n:"アスピリン 原末（川崎病 急性期）", s:"アセチルサリチル酸", type:"p", conc:100, dose:30, freq:"分3"},
 {id:"p_asa_conv", cat:"散", n:"アスピリン 原末（川崎病 回復期）", s:"アセチルサリチル酸", type:"p", conc:100, dose:5, freq:"分1"},
 {id:"p_carbo", cat:"散", n:"ムコダインDS 50%", s:"カルボシステイン", type:"p", conc:50, dose:30, freq:"分3", max:1500, note:"錠 250・500 mg／成人量 1500 mg/日"},
 {id:"s_muco", cat:"Sy", n:"ムコダイン Sy 5%", s:"カルボシステイン", type:"s", mgml:50, dose:30, freq:"分3", max:1500},
 {id:"p_mucosal", cat:"散", n:"ムコサールDS 1.5%", s:"アンブロキソール", type:"p", conc:1.5, dose:0.9, freq:"分3", max:45, note:"ムコソルバン／錠 15 mg・成人量 45 mg/日"},
 {id:"s_mucos", cat:"Sy", n:"ムコソルバン Sy 0.3%", s:"アンブロキソール", type:"s", mgml:3, dose:0.9, freq:"分3", max:45},
 {id:"p_asv_ds", cat:"散", n:"アスベリンDS 2%", s:"チペピジン・散は10%で濃度注意", type:"p", conc:2, dose:2, freq:"分3", max:120, note:"2-3 mg/kg/日 とする資料もあり／錠 10・20 mg・成人量 120 mg/日"},
 {id:"p_asv_san", cat:"散", n:"アスベリン散 10%", s:"チペピジン・DSは2%で濃度注意", type:"p", conc:10, dose:2, freq:"分3", max:120, note:"2-3 mg/kg/日 とする資料もあり"},
 {id:"s_asv", cat:"Sy", n:"アスベリン Sy 0.5%", s:"チペピジン", type:"s", mgml:5, dose:2, freq:"分3", max:120, note:"3 mg/kg/日（0.6 mL/kg/日）とする資料もあり"},
 {id:"p_medicon", cat:"散", n:"メジコン散 10%", s:"デキストロメトルファン", type:"p", conc:10, dose:1.5, freq:"分3", max:60, note:"錠 15 mg／成人量 60 mg/日"},
 {id:"p_transa", cat:"散", n:"トランサミン散 50%", s:"トラネキサム酸", type:"p", conc:50, dose:20, freq:"分3", max:750, note:"年齢別1日量の目安　新生児 100・6か月 200・1歳 300・3歳 400・7歳6か月 500・12歳 750 mg/日"},
 {id:"f_sp", cat:"錠", n:"SPトローチ 0.25 mg", s:"デカリニウム塩化物", type:"f", freq:"6回/日まで", note:"塩化デカリニウム／5歳未満には処方しない", val:"1回 1錠"},
 {id:"p_meptin", cat:"散", n:"メプチンDS 0.005%", s:"プロカテロール", type:"p", conc:0.005, dose:2.5, unit:"ug", freq:"分2-3", max:0.15, note:"錠 50 µg"},
 {id:"s_meptin", cat:"Sy", n:"メプチン Sy 0.0005%", s:"プロカテロール", type:"s", mgml:0.005, dose:2.5, unit:"ug", freq:"分2-3", max:0.15},
 {id:"a_meptin_inh", cat:"外", n:"メプチン 吸入液", s:"プロカテロール", type:"a", rows:[["乳児（1歳未満）", 0, 11, "10 µg", "0.1 mL", ""], ["幼児（1-5歳）", 12, 71, "20 µg", "0.2 mL", ""], ["学童（6歳以上）", 72, 9999, "30 µg", "0.3 mL", ""]]},

/* 年齢別の平均体重（男女平均・kg）。空欄の自動補完に使用 */
var AVG_W = [7.5,10.0,12.5,14.5,16.5,18.5,21.5,24.0,27.0,30.5,34.5,39.0,44.0,48.5,52.5,56.0];
function estWeight(Y){ if(Y<0) Y=0; return (Y>=AVG_W.length) ? AVG_W[AVG_W.length-1] : AVG_W[Y]; }
function estAge(W){ var best=0,bd=1e9,i,dd;
  for(i=0;i<AVG_W.length;i++){ dd=Math.abs(AVG_W[i]-W); if(dd<bd){bd=dd;best=i;} }
  return best; }

/* ===================== 計算 ===================== */
function fix(v,d){ var x = Math.round(v*Math.pow(10,d))/Math.pow(10,d); return x.toFixed(d); }
function trimZero(s){ if(s.indexOf(".")<0) return s;
  s = s.replace(/0+$/,""); if(s.charAt(s.length-1)===".") s = s.slice(0,-1); return s; }
function floorTo(v,step){ return Math.floor((v+1e-9)/step)*step; }
function roundG(g,step){
  if(step) return fix(floorTo(g,step), step<0.1?2:1);
  if(g>=0.1) return fix(floorTo(g,0.1),1);
  if(g>=0.01) return fix(floorTo(g,0.01),2);
  return fix(g,3);
}
function roundML(ml){ return ml>=0.1 ? fix(floorTo(ml,0.1),1) : fix(floorTo(ml,0.01),2); }

/* 年齢は「歳」入力。Y歳 = Y*12 〜 Y*12+11 か月 として区分に当てる */
function ageHit(rows, Y){
  var lo = Y*12, hi = Y*12+11, i;
  for(i=0;i<rows.length;i++) if(lo<=rows[i][2] && hi>=rows[i][1]) return i;
  return -1;
}

function calcOne(d, perKg, W){
  var mg = perKg*W;
  if(d.unit==="ug") mg = mg/1000;
  var capped = false;
  if(d.max && mg>d.max){ mg = d.max; capped = true; }
  return {mg:mg, g:mg/(d.conc*10), capped:capped};
}

/* 返り値 {big, freq, det, flag, none} */
function calc(d, W, Y){
  if(!d) return {big:"—", freq:"", det:"", flag:"", none:true};
  var i, r;

  if(d.type==="p"){
    var isInfant = (Y!==null && Y<1);
    var dv = (typeof d.dose.length==="number") ? (d.dose[0]+"-"+d.dose[1]) : d.dose;
    var ratio = d.ratio || (dv+(d.unit==="ug"?" µg":" mg")+"/kg/"+(d.per==="回"?"回":"日"));
    if(d.infant && isInfant) ratio = d.infant+" mg/kg/日（1歳未満）";
    if(W===null) return {big:"体重を入力", freq:d.freq, det:ratio, flag:"", none:true};
    var per = (d.infant && isInfant) ? d.infant : d.dose;
    if(typeof per.length === "number"){
      var lo = calcOne(d, per[0], W), hi = calcOne(d, per[1], W);
      return {amt: trimZero(fix(lo.mg,2))+" – "+trimZero(fix(hi.mg,2))+" mg",
        big: roundG(lo.g,d.step)+" – "+roundG(hi.g,d.step)+" g", freq:d.freq,
        det: ratio+"　／　計算値 "+trimZero(fix(lo.g,3))+" – "+trimZero(fix(hi.g,3))+" g"
            +(d.note?"\n"+d.note:""),
        flag: hi.capped ? "上限側は成人量に達しています" : ""};
    }
    var one = calcOne(d, per, W);
    var mg = one.mg, capped = one.capped, g = one.g;
    var amt = (d.unit==="ug") ? trimZero(fix(mg*1000,1))+" µg" : trimZero(fix(mg,2))+" mg";
    var det = ratio+"　／　計算値 "+trimZero(fix(g,3))+" g";
    if(d.id==="p_tamiflu") det += "　／　"+trimZero(fix(mg/75,2))+" Cap";
    if(d.id==="p_valtrex") det += "　／　"+trimZero(fix(mg/500,2))+" 錠";
    if(d.note) det += "\n"+d.note;
    return {amt:amt, big: roundG(g,d.step)+" g"+(d.per==="回"?"/回":""), freq:d.freq,
            det:det, flag: capped?"成人量の上限に達しています":""};
  }

  if(d.type==="s"){
    var rt = d.ratio || ((d.unit==="ug"? d.dose+" µg":d.dose+" mg")+"/kg/日");
    if(W===null) return {big:"体重を入力", freq:d.freq, det:rt, flag:"", none:true};
    var mg2 = d.dose*W;
    if(d.unit==="ug") mg2 = mg2/1000;
    var cap2 = false;
    if(d.max && mg2>d.max){ mg2 = d.max; cap2 = true; }
    var ml = mg2/d.mgml;
    var amt2 = (d.unit==="ug") ? trimZero(fix(mg2*1000,1))+" µg" : trimZero(fix(mg2,3))+" mg";
    var det2 = rt+"　／　計算値 "+trimZero(fix(ml,2))+" mL";
    if(d.note) det2 += "\n"+d.note;
    return {amt:amt2, big: roundML(ml)+" mL"+(d.per==="回"?"/回":""), freq:d.freq,
            det:det2, flag: cap2?"成人量の上限に達しています":""};
  }

  if(d.type==="t"){
    if(W===null) return {big:"体重を入力", freq:d.freq, det:d.ratio+"　／　"+d.note, flag:"", none:true};
    var hit = -1;
    for(i=0;i<d.rows.length;i++){ if(W>=d.rows[i][0]) hit = i; }
    if(hit<0) return {big:"表の範囲外", freq:d.freq, none:true,
      det:"最小 "+d.rows[0][0]+" kg から。"+d.ratio+" で個別に計算してください。", flag:""};
    r = d.rows[hit];
    var disp = (Math.round(r[2]*100)%10===0) ? fix(r[2],1) : fix(r[2],2);
    return {amt: r[1]+" mg", big: disp+" g", freq:d.freq,
      det:"体重 ≧ "+r[0]+" kg の行　／　"+d.ratio+"\n"+d.note,
      flag: (hit===d.rows.length-1) ? "成人量（上限）です" : ""};
  }

  if(d.type==="a"){
    if(Y===null) return {big:"年齢を入力", freq:"", det:"", flag:"", none:true};
    var k = ageHit(d.rows, Y);
    if(k>=0){
      r = d.rows[k];
      var note = r[0]+" の区分";
      if(r[1]>0 && Y*12 < r[1]) note += "（" + r[0].split("-")[0] + " からが対象）";
      if(!r[4]) return {biglab:"成分量", big:r[3], freq:r[5]||"", det:note, flag:""};
      return {amt:r[3], big:r[4], freq:r[5]||"", det:note, flag:""};
    }
    var lines = [];
    for(i=0;i<d.rows.length;i++) lines.push(d.rows[i][0]+"：" + (d.rows[i][4]||d.rows[i][3]));
    return {big:"年齢区分外", freq:"", det:lines.join("　／　"), flag:"添付文書の年齢区分を確認", none:true};
  }

  if(d.type==="x"){
    if(W===null) return {big:"体重を入力", freq:d.freq, det:d.ratio, flag:"", none:true};
    var gx = d.gkg*W, capx = false;
    if(d.maxg && gx > d.maxg){ gx = d.maxg; capx = true; }
    return {big: trimZero(fix(gx,2))+" g", freq:d.freq,
            det:d.ratio+"　／　計算値 "+trimZero(fix(d.gkg*W,3))+" g"+(d.note?"\n"+d.note:""),
            flag: capx?"成人量の上限に達しています":""};
  }

  if(d.type==="i"){
    if(W===null) return {big:"体重を入力", freq:d.freq,
      det:d.dose+" mg/kg（最大 "+d.max+" mg）", flag:"", none:true};
    var mgi = d.dose*W, capi = false;
    if(d.max && mgi>d.max){ mgi = d.max; capi = true; }
    return {biglab:"投与量", big: trimZero(fix(mgi,1))+" mg", freq:d.freq,
      det:d.dose+" mg/kg（最大 "+d.max+" mg）"+(d.note?"\n"+d.note:""),
      flag: capi?"最大量に達しています":""};
  }

  if(d.type==="c"){
    var needAge = false, needW = false;
    for(i=0;i<d.rows.length;i++){
      if(d.rows[i][1]>0 || d.rows[i][2]<9999) needAge = true;
      if(d.rows[i][3]!==null || d.rows[i][4]!==null) needW = true;
    }
    if((needW && W===null) || (needAge && Y===null)){
      var ls = [];
      for(i=0;i<d.rows.length;i++) ls.push(d.rows[i][0]+"：" + (d.rows[i][6]||d.rows[i][5]));
      return {big:(needW&&needAge)?"体重と年齢を入力":(needW?"体重を入力":"年齢を入力"),
              freq:d.freq, none:true, flag:"", det:ls.join("　／　")};
    }
    var lo2 = (Y===null?0:Y*12), hi2 = (Y===null?9999:Y*12+11);
    for(i=0;i<d.rows.length;i++){
      r = d.rows[i];
      var okAge = (!needAge) || (lo2 <= r[2] && hi2 >= r[1]);
      var okW = (r[3]===null || (W!==null && W>=r[3])) && (r[4]===null || (W!==null && W<r[4]));
      if(okAge && okW){
        var cdet = r[0]+" の区分"+(d.note?"\n"+d.note:"");
        if(!r[6]) return {biglab:"成分量", big:r[5], freq:r[7]||d.freq||"", det:cdet, flag:""};
        return {amt:r[5], big:r[6], freq:r[7]||d.freq||"", det:cdet, flag:""};
      }
    }
    var ls2 = [];
    for(i=0;i<d.rows.length;i++) ls2.push(d.rows[i][0]+"：" + (d.rows[i][6]||d.rows[i][5]));
    return {big:"区分外", freq:"", none:true, det:ls2.join("　／　"), flag:"添付文書の区分を確認"};
  }

  return {biglab:"用量", big:d.val, freq:d.freq, det:d.note||"", flag:""};
}

/* 「30 mg錠 2錠」のように錠が重複する表記を「30 mg 2錠」に（チュアブル錠などは残す） */
function tabFmt(t){
  if(typeof t!=="string") return t;
  t = t.replace(/(mg|µg|g)\s*錠(?=\s*[0-9.\/]+\s*錠)/g, "$1");
  t = t.replace(/(^|[^0-9.])([0-9]+)(\s*mL)(?!\s*\/\s*kg)/g, "$1$2.0$3");
  return t;
}
var calcRaw = calc;
calc = function(d, W, Y){
  var r = calcRaw(d, W, Y);
  r.big = tabFmt(r.big); r.amt = tabFmt(r.amt); r.det = tabFmt(r.det);
  return r;
};

    var r = calc(d, st.W, st.Y);
    var nm = document.getElementById("name"+i);
    if(nm) nm.innerHTML = d ? cjk(esc(d.n.slice(0,-2)))+'<span style="white-space:nowrap">'+cjk(esc(d.n.slice(-2)))+'<span class="i">i</span></span>' : "—";
    var sub = document.getElementById("sub"+i);
    if(sub) sub.textContent = d ? sublineOf(d, r) : "";
    var host = document.getElementById("res"+i);
    if(host) host.innerHTML = valsHTML(r);
    var fl = document.getElementById("flag"+i);
    if(fl) fl.innerHTML = r.flag ? '<span class="wflag">'+esc(r.flag)+'</span>' : "";
  }
  renderAll(st);
  markChips();
  fitRows();
  if(sheetMode==="detail") renderDetail();
}

function fitRows(){
  var rows = document.querySelectorAll("#slots .row");
  for(var i=0;i<rows.length;i++){
    var row = rows[i], nm = row.querySelector(".dname"), rv = row.querySelector(".rv");
    var parts = [nm].concat([].slice.call(row.querySelectorAll(".amt,.vbig")));
    for(var j=0;j<parts.length;j++) parts[j].style.fontSize = "";
    var base = parts.map(function(e){ return parseFloat(getComputedStyle(e).fontSize); });
    for(var sc=1; sc>=0.72; sc-=0.04){
      for(j=0;j<parts.length;j++) parts[j].style.fontSize = (sc<1 ? (base[j]*sc).toFixed(1)+"px" : "");
      var one = Math.abs(nm.offsetTop - rv.offsetTop) < 12 && nm.offsetHeight < base[0]*sc*1.3*1.6 + 8;
      if(one) break;
    }
  }
}
window.addEventListener("resize", function(){ fitRows(); });

/* ===================== シート ===================== */
var sheetMode = null, sheetDrug = null, sheetSlot = null, pickCat = "all", pickQ = "";

function openSheet(){ $("#ov").className = "ov open"; document.body.style.overflow = "hidden"; }
function closeSheet(){
  $("#ov").className = "ov"; document.body.style.overflow = "";
  sheetMode = null; $("#sheet").innerHTML = "";
}
$("#ov").addEventListener("click", function(ev){ if(ev.target===this) closeSheet(); });
document.addEventListener("keydown", function(ev){ if(ev.key==="Escape" && sheetMode) closeSheet(); });

function sheetHead(title, small){
  return '<div class="sh-h"><h2>'+esc(title)+(small?'<small>'+esc(small)+'</small>':'')+'</h2>'
       + '<button class="sh-x" id="shx" type="button" aria-label="閉じる">×</button></div>';
}

function openDetail(id, slotIdx){
  if(!byId[id]) return;
  sheetMode = "detail"; sheetDrug = id; sheetSlot = (slotIdx===undefined ? null : slotIdx);
  renderDetail(); openSheet();
}
function renderDetail(){
  var d = byId[sheetDrug], st = state(), r = calc(d, st.W, st.Y);
  var h = sheetHead(d.n, d.s);
  h += '<div class="sh-b">';
  h += '<div class="dres">';
  if(r.none){
    h += '<div class="none">'+esc(r.big)+'</div>';
  }else{
    if(r.amt) h += '<div><div class="vlab">成分量</div><div class="vnum">'+esc(r.amt)+'</div></div>';
    h += '<div><div class="vlab">'+esc(r.biglab||"薬剤量")+'</div><div class="vnum big">'+esc(r.big)+'</div></div>';
  }
  h += '</div>';
  if(r.flag) h += '<div class="dflag">'+esc(r.flag)+'</div>';
  h += '<table class="kv">';
  h += '<tr><th>分類</th><td>'+esc(d.cat)+'</td></tr>';
  if(d.s) h += '<tr><th>一般名</th><td>'+esc(d.s)+'</td></tr>';
  h += '<tr><th>基準</th><td>'+esc(basisOf(d))+'</td></tr>';
  if(r.freq || d.freq) h += '<tr><th>用法</th><td>'+esc(r.freq || d.freq)+'</td></tr>';
  if(r.det) h += '<tr><th>計算・注記</th><td>'+esc(r.det).replace(/\n/g,"<br>")+'</td></tr>';
  var st2 = [];
  if(st.Y!==null) st2.push(st.Y+" 歳"+(autoY?"（推定）":""));
  if(st.W!==null) st2.push(trimZero(fix(st.W,1))+" kg"+(autoW?"（推定）":""));
  h += '<tr><th>計算条件</th><td>'+(st2.length?esc(st2.join(" / ")):"未入力")+'</td></tr>';
  var ws = (autoW||autoY) ? null : wsdOf(st.W, st.Y);
  if(ws) h += '<tr><th>体重SD</th><td>男 '+sdTxt(ws.m)+' SD ／ 女 '+sdTxt(ws.f)+' SD'
    + '<br><span class="cat">'+Math.floor(ws.mo/12)+'歳'+(ws.mo%12)+'か月の基準値（日本小児内分泌学会 2000年度データ）</span></td></tr>';
  h += '</table>';
  if(sheetSlot!==null) h += '<div class="sh-actions"><button class="btn" id="todchg" type="button">この薬剤を変更</button></div>';
  h += '</div>';
  $("#sheet").innerHTML = h;
  $("#shx").onclick = closeSheet;
  if(sheetSlot!==null){ var slotIdx = sheetSlot; $("#todchg").onclick = function(){ openPicker(slotIdx); }; }
}

var pickAdd = false;
function pickCurId(){ return pickAdd ? null : slotDrug[sheetSlot]; }
function openPicker(i, isAdd){
  sheetMode = "pick"; sheetSlot = i; pickQ = ""; pickAdd = !!isAdd;
  var d = pickAdd ? null : byId[slotDrug[i]];
  pickCat = d ? d.cat : "all";
  var h = sheetHead(pickAdd ? "薬剤を追加" : "薬剤 "+(i+1)+" を選択");
  if(!pickAdd) h = h.replace('<button class="sh-x"', '<button class="pk-del" id="pkdel" type="button">この薬剤を削除</button><button class="sh-x"');
  h += '<div class="pk-top"><div class="pcats" id="pcats"></div>'
     + '<input class="pk-q" id="pkq" type="search" placeholder="薬剤名・一般名で検索" autocomplete="off"></div>';
  h += '<div class="plist" id="plist"></div>';
  $("#sheet").innerHTML = h;
  $("#shx").onclick = closeSheet;
  if(!pickAdd){ var slotIdx = i; $("#pkdel").onclick = function(){ closeSheet(); removeSlot(slotIdx); }; }
  $("#pkq").addEventListener("input", function(){
    pickQ = this.value.replace(/^\s+|\s+$/g,"");
    if(pickQ && pickCat!=="all"){ pickCat = "all"; renderPickCats(); }
    renderPickList();
  });
  renderPickCats(); renderPickList(); openSheet();
}
function renderPickCats(){
  var host = $("#pcats"); host.innerHTML = "";
  for(var c=0;c<CATS.length;c++){
    (function(code,label){
      var b = el("button"); b.type = "button"; b.textContent = label;
      if(pickCat===code) b.className = "on";
      b.onclick = function(){ pickCat = code; renderPickCats(); renderPickList(); };
      host.appendChild(b);
    })(CATS[c][0],CATS[c][1]);
  }
}
function renderPickList(){
  var host = $("#plist"), st = state(), list = listFor(pickCat), q = pickQ.toLowerCase();
  host.innerHTML = "";
  var curEl = null, n = 0;
  for(var k=0;k<list.length;k++){
    var d = list[k];
    if(q && (d.n+" "+(d.s||"")).toLowerCase().indexOf(q)<0) continue;
    n++;
    var r = calc(d, st.W, st.Y);
    var b = el("button","pitem"+(d.id===pickCurId()?" cur":"")); b.type = "button";
    b.innerHTML = '<span class="pn"><b>'+esc(d.n)+'</b><span>'+esc(sublineOf(d, r))+'</span></span>'
      + (pickCat==="all" ? '<span class="pc">'+esc(d.cat)+'</span>' : '')
      + (r.none ? '' : '<span class="pv">'+esc(r.big)+'</span>');
    (function(id){ b.onclick = function(){
      if(pickAdd){
        var k = slotDrug.indexOf(id, slotCount); if(k>=0) slotDrug.splice(k,1);
        slotDrug.splice(slotCount, 0, id); slotCount++;
        closeSheet(); setCntButtons(); buildSlots();
        var sl = document.querySelectorAll("#slots .slot"); if(sl.length) sl[sl.length-1].scrollIntoView({block:"nearest"});
      }else{ slotDrug[sheetSlot] = id; closeSheet(); renderResults(); }
    }; })(d.id);
    if(d.id===pickCurId()) curEl = b;
    host.appendChild(b);
  }
  if(!n) host.innerHTML = '<div class="pempty">該当する薬剤がありません</div>';
  if(curEl && !q) setTimeout(function(){ host.scrollTop = Math.max(0, curEl.offsetTop - host.offsetTop - 60); }, 0);
}

function basisOf(d){
  if(d.ratio) return d.ratio;
  if(d.type==="p"||d.type==="s"){
    var u = (d.unit==="ug")?" µg":" mg";
    var v = (typeof d.dose.length==="number") ? (d.dose[0]+"-"+d.dose[1]) : d.dose;
    return v+u+"/kg/"+(d.per==="回"?"回":"日");
  }
  if(d.type==="i") return d.dose+" mg/kg";
  if(d.type==="t") return "体重帯 早見表";
  if(d.type==="a") return "年齢区分";
  if(d.type==="c") return "年齢・体重区分";
  return "定量";
}

function renderAll(st){
  var tb = $("#alltab").getElementsByTagName("tbody")[0];
  tb.innerHTML = "";
  for(var i=0;i<DRUGS.length;i++){
    var d = DRUGS[i], r = calc(d, st.W, st.Y), tr = el("tr");
    tr.innerHTML = '<td class="tn" data-id="'+d.id+'">'+d.n+(d.s?' <span class="cat">'+d.s+'</span>':'')+'</td>'
      + '<td class="cat">'+basisOf(d)+'</td>'
      + '<td class="n">'+((r.none||!r.amt)?"—":r.amt)+'</td>'
      + '<td class="n">'+(r.none?"—":r.big)+'</td>'
      + '<td class="cat">'+(r.freq||d.freq||"")+'</td>';
    tb.appendChild(tr);
  }
}
$("#alltab").addEventListener("click", function(ev){
  var t = ev.target; while(t && t!==this && !(t.getAttribute && t.getAttribute("data-id"))) t = t.parentNode;
  if(t && t!==this) openDetail(t.getAttribute("data-id"));
});

/* ===================== セット ===================== */
function renderChips(){
  var host = $("#chips"); host.innerHTML = ""; var i;
  for(i=0;i<PRESETS.length;i++) host.appendChild(makeChip(PRESETS[i], false, i));
  for(i=0;i<userSets.length;i++) host.appendChild(makeChip(userSets[i], true, i));
  var add = el("button","chip");
  add.style.borderStyle = "dashed";
  add.innerHTML = "＋ 現在の組合せを登録";
  add.onclick = function(){ $("#saverow").className = "saverow open"; $("#setname").focus(); };
  host.appendChild(add);
  markChips();
}
function makeChip(set, isUser, idx){
  var c = el("button","chip"+(isUser?" user":""));
  var label = el("span"); label.textContent = set.name;
  c._ids = set.ids;
  c.appendChild(label);
  c.onclick = function(){ applySet(set); };
  if(isUser){
    /* 誤タップ防止：× → 「削除」の2段階。4秒で元に戻る */
    var x = el("span","x"); x.textContent = "×"; x.title = "このセットを削除";
    var armed = false, tm = null;
    function disarm(){ armed = false; if(tm){ clearTimeout(tm); tm = null; }
      x.textContent = "×"; x.className = "x"; c.className = c.className.replace(/\s*\barm\b/g,""); }
    x.onclick = function(ev){
      ev.stopPropagation();
      if(!armed){
        armed = true; x.textContent = "削除"; x.className = "x go"; c.className += " arm";
        tm = setTimeout(disarm, 4000);
        return;
      }
      disarm();
      userSets.splice(idx,1); saveSets(); renderChips();
      flash("「"+set.name+"」を削除しました");
    };
    c.appendChild(x);
  }
  return c;
}
/* 現在の薬剤の並びと一致するセットのボタンを選択色に */
function markChips(){
  var cs = document.querySelectorAll("#chips .chip"), cur = slotDrug.slice(0, slotCount).join(",");
  for(var i=0;i<cs.length;i++){
    if(!cs[i]._ids) continue;
    var on = cs[i]._ids.slice(0, MAXSLOT).join(",")===cur && slotCount>0;
    cs[i].className = cs[i].className.replace(/\s*\bon\b/g,"") + (on?" on":"");
  }
}
function applySet(set, silent){
  var n = set.ids.length; if(n>MAXSLOT) n = MAXSLOT;
  slotCount = n;
  for(var i=0;i<MAXSLOT;i++){
    if(set.ids[i]) slotDrug[i] = set.ids[i];
  }
  setCntButtons(); buildSlots();
  if(!silent) flash("「"+set.name+"」を読み込み");
}
function setCntButtons(){
  var b = $("#adddrug"); if(!b) return;
  b.disabled = (slotCount>=MAXSLOT);
  b.textContent = (slotCount>=MAXSLOT) ? "最大 "+MAXSLOT+" 剤です" : "＋ 薬剤を追加";
}
function removeSlot(i){
  var id = slotDrug.splice(i,1)[0];
  slotDrug.push(id);            /* 末尾（非表示枠）へ回す */
  slotCount = Math.max(0, slotCount-1);
  setCntButtons(); buildSlots();
}
$("#adddrug").onclick = function(){ if(slotCount<MAXSLOT) openPicker(slotCount, true); };

/* ===================== 初期化 ===================== */
loadSets();
renderChips();
setCntButtons();
if(PRESETS.length) applySet(PRESETS[0], true);
else buildSlots();
showSummary();

function selectAllOnFocus(el){
  var pick = function(){ setTimeout(function(){ try{ el.select(); }catch(e){} }, 0); };
  el.addEventListener("focus", pick);
  el.addEventListener("click", pick);
}
selectAllOnFocus($("#w"));
selectAllOnFocus($("#y"));

$("#w").addEventListener("input", function(){ autofill("w"); renderResults(); showSummary(); });
$("#y").addEventListener("input", function(){ autofill("y"); renderResults(); showSummary(); });

function bumpWeight(delta){
  var wEl = $("#w"), v = parseFloat(wEl.value);
  if(isNaN(v) || v<=0) v = 10; else v = v + delta;
  if(v < 1) v = 1;
  if(v > 120) v = 120;
  wEl.value = trimZero(fix(v,1));
  autofill("w"); renderResults(); showSummary();
}
function bumpAge(delta){
  var yEl = $("#y"), v = parseInt(yEl.value,10);
  if(isNaN(v)) v = 3; else v = v + delta;
  if(v < 0) v = 0;
  if(v > 18) v = 18;
  yEl.value = v;
  autofill("y"); renderResults(); showSummary();
}
$("#wminus").onclick = function(){ bumpWeight(-1); };
$("#wplus").onclick  = function(){ bumpWeight(1); };
$("#yminus").onclick = function(){ bumpAge(-1); };
$("#yplus").onclick  = function(){ bumpAge(1); };

$("#clear").onclick = function(){
  $("#w").value=""; $("#y").value="";
  autoW = false; autoY = false;
  $("#w").className=""; $("#y").className="";
  renderResults(); showSummary(); $("#w").focus();
};

$("#dosave").onclick = function(){
  var nm = $("#setname").value.replace(/^\s+|\s+$/g,"");
  if(!nm){ flash("セット名を入力してください", true); return; }
  var ids = [];
  for(var i=0;i<slotCount;i++) if(slotDrug[i]) ids.push(slotDrug[i]);
  userSets.push({name:nm, ids:ids});
  saveSets(); renderChips();
  $("#setname").value=""; $("#saverow").className="saverow";
  flash("「"+nm+"」を登録しました");
};
$("#cancelsave").onclick = function(){
  $("#setname").value=""; $("#saverow").className="saverow";
};
</script>
